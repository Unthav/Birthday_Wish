<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For you</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;1,400;1,600&display=swap" rel="stylesheet">

<body>
<main>

  <button id="more">One more thing</button>
  <div id="gallery"><figure><img src="images/photo1.jpg" alt="Us, photo 1"></figure><figure><img src="images/photo2.jpg" alt="Us, photo 2"></figure><figure><img src="images/photo3.jpg" alt="Us, photo 3"></figure><figure><img src="images/photo4.jpg" alt="Us, photo 4"></figure></div>
  <div id="fin"></div>
</main>
<script src="script.js"></script>

</html>
